name: One-time validation of preserved web archive
on:
  push:
    branches: [archive/web-technologies-2026]
    paths: ['.github/workflows/check-web-archive-once.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Syntax and original cross-reference check
        run: |
          python3 -m py_compile web-technologies/tools/archive_web.py web-technologies/tools/check_reports.py
          python3 web-technologies/tools/check_reports.py
      - name: Completed archive validation
        run: python3 web-technologies/tools/check_reports.py --archive
