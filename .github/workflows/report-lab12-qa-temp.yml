name: Temporary lab12 LaTeX verification
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 web-technologies/tools/check_reports.py
      - name: Compile lab12 with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: web-technologies/lab12/latex-report/main.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: true
