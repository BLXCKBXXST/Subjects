name: One-time visual QA of archived web reports
on:
  push:
    branches: [archive/web-technologies-2026]
    paths: ['.github/workflows/web-archive-qa-once.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf==1.26.4
      - name: Render first, note and last pages; inspect actual PDF text
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .web-archive-review
          python - <<'PY'
          from pathlib import Path
          import fitz
          for n in range(10, 15):
              source=Path(f'web-technologies/lab{n}/archive/lab{n}_archival.pdf')
              doc=fitz.open(str(source))
              assert len(doc)>=5,(n,len(doc))
              content=' '.join(p.get_text() for p in doc)
              assert 'СКРИНШОТ НЕ ДОБАВЛЕН' not in content, n
              assert 'Примечание к архивной копии' in content, n
              for label,index in [('first',0),('note',min(2,len(doc)-1)),('last',len(doc)-1)]:
                  pix=doc[index].get_pixmap(matrix=fitz.Matrix(1.25,1.25),alpha=False)
                  pix.save(f'.web-archive-review/lab{n}-{label}.png')
              print(f'lab{n}: {len(doc)} pages, {len(content)} text chars, no old missing-image placeholders')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: web-archive-visual-QA
          path: |
            web-technologies/lab10/archive/lab10_archival.pdf
            web-technologies/lab11/archive/lab11_archival.pdf
            web-technologies/lab12/archive/lab12_archival.pdf
            web-technologies/lab13/archive/lab13_archival.pdf
            web-technologies/lab14/archive/lab14_archival.pdf
            .web-archive-review/*.png
          if-no-files-found: error
          retention-days: 7
