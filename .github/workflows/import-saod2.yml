name: Import saod2 archive (one time)

on:
  push:
    branches:
      - import/saod2-archive
    paths:
      - '.saod2-import/**'
      - '.github/workflows/import-saod2.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify archive and import
        shell: bash
        run: |
          set -euo pipefail
          cat .saod2-import/part*.b64 | base64 -d > /tmp/saod2-source.tar.gz
          echo 'af822a879ef73dc4435b99fa2cb47dde862976f6704187172d438708e4641788  /tmp/saod2-source.tar.gz' | sha256sum --check
          python3 - <<'PY'
          import tarfile
          import shutil
          from pathlib import Path, PurePosixPath

          root = Path("saod2")
          root.mkdir(exist_ok=False)
          count = 0
          with tarfile.open("/tmp/saod2-source.tar.gz", "r:gz") as archive:
              seen = set()
              for item in archive:
                  source = PurePosixPath(item.name)
                  if source.is_absolute() or not source.parts or source.parts[0] != "saod" or ".." in source.parts:
                      raise ValueError(f"Unsafe archive path: {item.name}")
                  if not (item.isdir() or item.isfile()):
                      raise ValueError(f"Unexpected link or special file: {item.name}")
                  relative = source.parts[1:]
                  if not relative:
                      if not item.isdir():
                          raise ValueError("Unexpected archive root")
                      continue
                  destination = root.joinpath(*relative)
                  if item.isdir():
                      destination.mkdir(parents=True, exist_ok=True)
                      continue
                  if destination in seen:
                      raise ValueError(f"Duplicate archive path: {item.name}")
                  seen.add(destination)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  with archive.extractfile(item) as source_file, destination.open("wb") as target_file:
                      shutil.copyfileobj(source_file, target_file)
                  count += 1
          assert count == 26, f"Expected 26 files, got {count}"
          print(f"Imported {count} original files into saod2/")
          PY
      - name: Commit files and remove temporary import tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .saod2-import
          rm -f .github/workflows/import-saod2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A -- saod2
          git add -u -- .saod2-import .github/workflows/import-saod2.yml
          test "$(git ls-files saod2 | wc -l)" -eq 26
          git commit -m "Import 26 files from saod2 archive"
          git push origin HEAD:import/saod2-archive
