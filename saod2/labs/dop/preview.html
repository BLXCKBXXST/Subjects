<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ДОП — точный алгоритм</title>
<style>
body { margin: 0; background: #f1f5f9; font: 16px Arial, sans-serif; color: #0f172a; }
header { background: white; padding: 18px 24px; border-bottom: 1px solid #cbd5e1; }
section { margin: 20px; background: white; padding: 18px; border-radius: 10px; }
figure { margin: 0; overflow: auto; }
img { max-width: none; }
</style>
</head>
<body>
<header>ДОП: в каждой вершине указан ключ и его вес. Откройте SVG отдельно, если нужно увеличить масштаб.</header>
<section><h2>Пример: 10 вершин</h2><figure><img src="../../dop10.svg" alt="ДОП на 10 вершинах"></figure></section>
<section><h2>ДОП: 100 вершин</h2><figure><img src="../../dop.svg" alt="ДОП на 100 вершинах"></figure></section>
</body>
</html>
