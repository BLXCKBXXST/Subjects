<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Курсовая — дерево А2</title>
<link rel="stylesheet" href="../../labs/lab-viewer.css">
<header><h1>Курсовая — дерево А2</h1>
<p>Ключ — заглавие книги. Вес — количество записей с таким заглавием среди найденных по году.</p></header>
<section class="tree-view">
<h2>Дерево найденных записей</h2>
<p id="message">В программе выполните сортировку и поиск по году.</p>
<div class="viewport"><img id="tree" alt="Дерево А2 по заглавиям книг"></div>
</section>
<script src="../../labs/lab-viewer.js"></script>
<script>
let revision = null, loading = false;
function refresh() {
    if (loading) return;
    loading = true;
    const script = document.createElement('script');
    script.src = 'a2-state.js?v=' + Date.now();
    script.onload = () => {
        script.remove(); loading = false;
        if (typeof window.courseworkRevision !== 'string') return;
        if (revision !== window.courseworkRevision) {
            revision = window.courseworkRevision;
            document.getElementById('tree').src = 'a2.svg?v=' + encodeURIComponent(revision);
            document.getElementById('message').textContent =
                'Рисунок обновляется после нового поиска по году.';
        }
    };
    script.onerror = () => {
        script.remove(); loading = false;
        if (revision === null)
            document.getElementById('message').textContent = 'Запустите курсовую и выполните поиск по году.';
    };
    document.head.appendChild(script);
}
refresh();
setInterval(refresh, 1000);
</script>
</html>
